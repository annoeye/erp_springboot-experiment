# =============================================================================
# Oracle Database XE
# =============================================================================

services:
  oracle-db:
    image: gvenzl/oracle-xe:11.2.0.2-slim
    container_name: oracle-db
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET:-AL32UTF8}
      ORACLE_MEMORY: ${ORACLE_MEMORY:-1024}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "tnsping", "XE", "1" ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      backend:
        aliases:
          - oracle-db
