services:
  redis:
    image: "redis:8.6.4-alpine3.23"
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--aclfile", "./etc/redis/users.acl"]
    volumes:
      - redis-data:/data
      - ./users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network