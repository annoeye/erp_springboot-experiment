services:
  elasticsearch: # Đổi thành viết thường toàn bộ
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch 
    restart: unless-stopped

    environment:
      - node.name=elasticsearch
      - discovery.type=single-node # Sửa dấu chấm thành gạch ngang
      - bootstrap.memory_lock=true # Thêm chữ t vào bootstrap
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=elastic11 
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports: 
      - "9200:9200"
    networks:
      - backend  # Đưa về mạng backend chung của dự án
      - frontend # Cho phép máy của bạn kết nối qua port 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:elastic11 http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0 # Đồng bộ phiên bản 8.17.0 với Elasticsearch
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana11
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch # Sửa đồng bộ tên service viết thường
    networks:
      - backend
      - frontend # Cho phép bạn truy cập Web Kibana từ trình duyệt

volumes:
  es_data: # Khai báo volume lưu trữ dữ liệu
