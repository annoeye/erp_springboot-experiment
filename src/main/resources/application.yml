spring:
  application:
    name: ERP_SpringBoot-Experiment

  config:
    import: optional:file:.env[.properties]

  contact:
    name: ANNOEYE
    url: zalo.me/0971791373
    email: annoeye@gmail.com

  main:
    allow-bean-definition-overriding: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    mapper:
      default-view-inclusion: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:Spring_app}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      initialization-fail-timeout: -1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USER}"
        password="${KAFKA_PASSWORD}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 5
    consumer:
      group-id: erp-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      concurrency: 3
      ack-mode: manual
      auto-startup: true
      missing-topics-fatal: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  web:
    resources:
      static-locations: classpath:/static/

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:app_cache}
      password: ${REDIS_PASSWORD}

  output:
    ansi:
      enabled: ALWAYS

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    problemdetails:
      enabled: true

integration:
  minio:
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY}
    url: ${MINIO_URL:http://localhost:9000}

server:
  port: 8080
  url: http://localhost:8080

frontend:
  url: http://localhost:5173/berry-vue

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    display-request-duration: true
    tags-sorter: alpha
  show-actuator: false
  default-produces-media-type: application/json

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com:
      anno:
        ERP_SpringBoot_Experiment:
          service: DEBUG
    org:
      springframework:
        data:
          repository:
            config:
              RepositoryConfigurationExtensionSupport: WARN
      apache:
        kafka: WARN
      hibernate:
        tool:
          schema:
            internal:
              ExceptionHandlerLoggedImpl: ERROR
    org.hibernate: WARN

  pattern:
    console: "%boldYellow(%d{HH:mm:ss.SSS}) %boldCyan(%d{yyyy-MM-dd}) %green([%thread]) %highlight(%-5level) %cyan(%logger{36}) %magenta([%file:%line]) %yellow(-) %msg%n%clr(%wEx){red}"
